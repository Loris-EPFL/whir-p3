[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
# Plonky3 — single pin for the whole workspace
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-mersenne-31 = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-koala-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-commit = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-dft = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-util = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-interpolation = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-challenger = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-multilinear-util = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-keccak = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-poseidon2 = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }
p3-mds = { git = "https://github.com/Plonky3/Plonky3.git", rev = "c38eb05" }

# Third-party
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
rayon = { version = "1.0" }
hashbrown = "0.16"
itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }
libm = "0.2.15"
thiserror = { version = "2.0", default-features = false }
tracing = { version = "0.1.37", default-features = false, features = ["attributes"] }
rand = { version = "0.10", default-features = false }
serde_json = "1.0"
sha2 = "0.11.0"

# Bin-only
clap = { version = "4.5", features = ["derive"] }
tracing-forest = "0.3"
tracing-subscriber = { version = "0.3.17", default-features = false, features = ["alloc", "env-filter"] }
bincode = "1.3"
criterion = "0.8"
proptest = { version = "1.0", default-features = true }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
dead_code = "allow"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"
should_panic_without_expect = "allow"
similar_names = "allow"
suboptimal_flops = "allow"
cast_sign_loss = "allow"
tuple_array_conversions = "allow"

[profile.profiling]
inherits = "release"
debug = true
