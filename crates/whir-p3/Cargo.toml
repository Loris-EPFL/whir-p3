[package]
name = "whir-p3"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
default-run = "main"

[lints]
workspace = true

[dependencies]
whir-core = { path = "../whir-core", default-features = false }
whir-pcs = { path = "../whir-pcs", default-features = false }
whir-spartan = { path = "../whir-spartan", default-features = false }
accumulation = { path = "../accumulation", default-features = false }
warp = { path = "../warp", default-features = false }
quasar = { path = "../quasar", default-features = false }
whir-circuit = { path = "../whir-circuit", default-features = false }
whir-ivc = { path = "../whir-ivc", default-features = false }
whir-cp-snark = { path = "../whir-cp-snark", default-features = false, optional = true }

serde.workspace = true
rayon = { workspace = true, optional = true }
p3-field.workspace = true
p3-baby-bear.workspace = true
p3-mersenne-31.workspace = true
p3-koala-bear.workspace = true
p3-merkle-tree.workspace = true
p3-symmetric.workspace = true
p3-matrix.workspace = true
p3-commit.workspace = true
p3-goldilocks.workspace = true
p3-dft.workspace = true
p3-util.workspace = true
p3-maybe-rayon.workspace = true
p3-interpolation.workspace = true
p3-challenger.workspace = true
p3-multilinear-util.workspace = true
p3-keccak.workspace = true
p3-poseidon2.workspace = true
p3-mds.workspace = true

symphony = { path = "../../../Symphony", default-features = false, optional = true }
sha2 = { workspace = true, optional = true }

hashbrown.workspace = true
itertools.workspace = true
libm.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
serde_json.workspace = true

# Bin-only deps pulling std
clap = { version = "4.5", features = ["derive"], optional = true }
tracing-forest = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3.17", default-features = false, features = [
    "alloc",
    "env-filter",
], optional = true }
bincode = { version = "1.3", optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon", "p3-maybe-rayon/parallel", "p3-util/parallel", "whir-core/parallel", "whir-pcs/parallel", "whir-spartan/parallel", "accumulation/parallel", "warp/parallel", "quasar/parallel", "whir-circuit/parallel", "whir-ivc/parallel"]
bench-timing = ["whir-pcs/bench-timing"]
rayon = ["dep:rayon"]
cli = ["dep:clap", "dep:tracing-subscriber", "dep:tracing-forest", "dep:bincode", "rand/default"]
symphony = ["dep:symphony", "dep:sha2", "dep:whir-cp-snark", "whir-ivc/symphony"]

[[bin]]
name = "main"
path = "src/bin/main.rs"
required-features = ["cli"]

[[bin]]
name = "accumulation_report"
path = "src/bin/accumulation_report.rs"

[[bin]]
name = "cp_snark_bench"
path = "src/bin/cp_snark_bench.rs"
required-features = ["symphony"]

[[bin]]
name = "arity_bench"
path = "src/bin/arity_bench.rs"

[[bin]]
name = "profile_spartan"
path = "src/bin/profile_spartan.rs"

[[bench]]
name = "whir"
harness = false

[[bench]]
name = "evaluate"
harness = false

[[bench]]
name = "eval_multilinear"
harness = false

[[bench]]
name = "sumcheck"
harness = false

[[bench]]
name = "stir_queries"
harness = false

[[bench]]
name = "spartan"
harness = false

[[bench]]
name = "accumulation"
harness = false
