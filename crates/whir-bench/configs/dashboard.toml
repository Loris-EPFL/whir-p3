# Unified dashboard config with explicit apples-to-apples workloads.
#
# By default, `bench` runs the explicit [[workloads.points]] below: same plotted
# values, no unplotted Cartesian products. Use `--workload-mode cartesian` to
# run the exhaustive [workloads.axes] products for the same workloads.

warmup  = 0
repeats = 1
output  = "output/dashboard.jsonl"
render_pdf = true
pdf_output = "output/dashboard.pdf"

microbenches = [
    "fs_scaling",
    "fold_verify",
    "circuit_size_arity",
    "circuit_sizes_l2",
    "terminal_whir",
    "warp_vs_whir",
    "whir_in_circuit_estimate",
]

# ── Workload A: same N R1CS instances, large constraints ─────────────
# This is the fair full-workload comparison for WHIR vs WARP:
# every scheme proves the same number of Spartan-linearized R1CS instances.
[[workloads]]
name = "family_a_same_n"
schemes = [
    "independent_whir",
    "pure_warp",
    "pure_warp_succinct",
    "warp_standard",
    "warp_standard_succinct",
    "warp_union",
    "warp_union_succinct",
]

[workloads.axes]
log_n           = [14, 16, 18, 20]
total_instances = [48, 96, 192, 384]
arity           = [4]
batch           = [8]
ivc_steps       = [1] # ignored by same-N schemes when total_instances is set
step_muls       = [100]
seed            = 42

[[workloads.points]]
log_n           = 14
total_instances = 48
arity           = 4
batch           = 8
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 16
total_instances = 96
arity           = 4
batch           = 8
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 18
total_instances = 192
arity           = 4
batch           = 8
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 20
total_instances = 384
arity           = 4
batch           = 8
ivc_steps       = 1
step_muls       = 100
seed            = 42

# ── Workload B: same N, varying arity ────────────────────────────────
# This is the fair full-workload Quasar comparison: standard WARP absorbs
# individual roots, Quasar/union absorbs one union root. Both process the same
# total_instances at the same arity.
[[workloads]]
name = "quasar_arity"
schemes = [
    "warp_standard",
    "warp_standard_succinct",
    "warp_union",
    "warp_union_succinct",
]

[workloads.axes]
log_n           = [18, 20]
total_instances = [192, 384]
arity           = [4, 8, 16, 32, 64]
batch           = [1]
ivc_steps       = [1]
step_muls       = [100]
seed            = 42

# Two log_n × five arity points = 10 cells. log_n=18 with 192 instances is
# the cheap reference; log_n=20 with 384 instances is the headline Quasar
# scaling sweep.
[[workloads.points]]
log_n           = 18
total_instances = 192
arity           = 4
batch           = 1
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 18
total_instances = 192
arity           = 16
batch           = 1
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 18
total_instances = 192
arity           = 64
batch           = 1
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 20
total_instances = 384
arity           = 4
batch           = 1
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 20
total_instances = 384
arity           = 8
batch           = 1
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 20
total_instances = 384
arity           = 16
batch           = 1
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 20
total_instances = 384
arity           = 32
batch           = 1
ivc_steps       = 1
step_muls       = 100
seed            = 42

[[workloads.points]]
log_n           = 20
total_instances = 384
arity           = 64
batch           = 1
ivc_steps       = 1
step_muls       = 100
seed            = 42

# ── Workload C: same number of recursive step circuits ───────────────
# This is the fair recursive-IVC comparison. total_step_circuits is the work
# unit; arity changes how many fresh recursive circuits are folded per union
# step. Non-divisible tails are padded and reported as padding_step_circuits.
[[workloads]]
name = "recursive_ivc"
schemes = [
    "warp_recursive_standard_arity",
    "warp_recursive_standard_arity_succinct",
    "quasar_warp",
    "quasar_warp_succinct",
    "symphony_standard_arity",
    "symphony_standard_arity_succinct",
    "quasar_symphony",
    "quasar_symphony_succinct",
]

[workloads.axes]
log_n               = [18, 20]
total_step_circuits = [48, 192]
arity               = [4, 8, 16]
batch               = [1]
ivc_steps           = [1]
step_muls           = [100]    # step_muls=10000 dropped — that block is the killer
seed                = 42

[[workloads.points]]
log_n               = 18
total_step_circuits = 48
arity               = 16
batch               = 1
ivc_steps           = 1
step_muls           = 100
seed                = 42

[[workloads.points]]
log_n               = 20
total_step_circuits = 48
arity               = 16
batch               = 1
ivc_steps           = 1
step_muls           = 100
seed                = 42

[[workloads.points]]
log_n               = 20
total_step_circuits = 192
arity               = 16
batch               = 1
ivc_steps           = 1
step_muls           = 100
seed                = 42

# ── Microbench axes ──────────────────────────────────────────────────
# These are supporting measurements, not substitutes for the full workload
# rows above.
[microbench_axes]
arity            = [2, 4, 8, 16, 32, 64]
log_m            = 20
log_n            = 21
log_size         = [14, 16, 18, 20]
terminal_repeats = 3
n_instances      = [4, 16, 64]    # 192 dropped to keep warp_vs_whir tractable at log_n=20
aggregate_log_n  = [14, 16, 18, 20]
